<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="wayfinder-loops 報告書:介紹 wayfinder-loops、用 GitHub Project 看板管理,與從零建立並啟動工作流。人只做決定與審查整合 PR。" />
  <title>wayfinder-loops 報告書</title>

  <!-- docsify 官方 Vue 主題 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />

  <style>
    :root {
      --theme-color: #42b883;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei',
        'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
    }
    .sidebar .ch {
      color: #42b883;
      font-weight: 600;
      margin-right: 0.4rem;
      font-variant-numeric: tabular-nums;
    }
    /* archify 互動圖:iframe 嵌入 */
    .markdown-section .arch-embed {
      margin: 1.5em 0 0.4em;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }
    .markdown-section .arch-embed iframe {
      display: block;
      width: 100%;
      height: var(--h, 720px);
      border: 0;
    }
    /* 嵌入框突破正文寬度：手機用滿螢幕，有側欄時撐滿側欄右邊的內容區 */
    .markdown-section .arch-embed,
    .markdown-section .arch-open {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - 32px);
    }
    @media (min-width: 768px) {
      .markdown-section .arch-embed,
      .markdown-section .arch-open {
        width: min(1320px, calc(100vw - 300px - 64px));
      }
    }
    @media (min-width: 1100px) {
      .markdown-section .arch-embed iframe {
        height: var(--h-wide, 820px);
      }
    }
    .markdown-section .arch-open {
      margin-top: 0;
      text-align: right;
      font-size: 0.85em;
    }
    .markdown-section table {
      display: block;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="app">載入中…</div>

  <script>
    window.$docsify = {
      name: 'wayfinder-loops',
      repo: 'taisianghuang/wayfinder-loops-guide',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      homepage: '00-overview.md',
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 3,
      relativePath: true,
      search: {
        placeholder: '搜尋報告書…',
        noData: '找不到結果',
        depth: 3
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>

  <!-- docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <!-- plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.1.0/dist/docsify-pagination.min.js"></script>
  <!-- prism syntax components -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
</body>
</html>
